<!DOCTYPE html>
<html>
<head>
    <title>AutosRent - App Offline</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .offline-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        .offline-icon {
            font-size: 4rem;
            color: #007bff;
            margin-bottom: 1rem;
        }
        .offline-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #333;
        }
        .offline-message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #666;
            line-height: 1.5;
        }
        .retry-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .retry-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🚗</div>
        <h1 class="offline-title">AutosRent</h1>
        <p class="offline-message">
            No hay conexión a internet en este momento. 
            Algunas funciones pueden no estar disponibles.
        </p>
        <button class="retry-button" onclick="window.location.reload()">
            Reintentar conexión
        </button>
    </div>
</body>
</html>
